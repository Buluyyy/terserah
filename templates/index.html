<!DOCTYPE html>
<html>
<head>
    <title>Zombie Shooter</title>
    <style>
        body { margin:0; background:#111; overflow:hidden; }
        canvas { display:block; margin:auto; background:#222; }
        #ui {
            position:absolute;
            top:10px;
            left:10px;
            color:white;
            font-family:Arial;
        }
    </style>
</head>
<body>

<div id="ui">
    <h2>Score: <span id="score">0</span></h2>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 800;
canvas.height = 600;

let score = 0;

const player = {
    x: 400,
    y: 300,
    size: 20,
    speed: 4
};

let bullets = [];
let zombies = [];
let keys = {};

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

canvas.addEventListener("click", function(e){
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const angle = Math.atan2(mouseY - player.y, mouseX - player.x);
    bullets.push({
        x: player.x,
        y: player.y,
        dx: Math.cos(angle)*6,
        dy: Math.sin(angle)*6,
        size:5
    });
});

function spawnZombie(){
    const side = Math.floor(Math.random()*4);
    let x,y;
    if(side===0){ x=0; y=Math.random()*600; }
    if(side===1){ x=800; y=Math.random()*600; }
    if(side===2){ x=Math.random()*800; y=0; }
    if(side===3){ x=Math.random()*800; y=600; }

    zombies.push({x,y,size:25,speed:1.5});
}

function update(){
    ctx.clearRect(0,0,800,600);

    // Movement
    if(keys["w"]||keys["ArrowUp"]) player.y -= player.speed;
    if(keys["s"]||keys["ArrowDown"]) player.y += player.speed;
    if(keys["a"]||keys["ArrowLeft"]) player.x -= player.speed;
    if(keys["d"]||keys["ArrowRight"]) player.x += player.speed;

    // Draw Player
    ctx.fillStyle="cyan";
    ctx.beginPath();
    ctx.arc(player.x,player.y,player.size,0,Math.PI*2);
    ctx.fill();

    // Update bullets
    bullets.forEach((b,i)=>{
        b.x += b.dx;
        b.y += b.dy;

        ctx.fillStyle="yellow";
        ctx.beginPath();
        ctx.arc(b.x,b.y,b.size,0,Math.PI*2);
        ctx.fill();

        if(b.x<0||b.x>800||b.y<0||b.y>600){
            bullets.splice(i,1);
        }
    });

    // Update zombies
    zombies.forEach((z,zi)=>{
        const angle = Math.atan2(player.y - z.y, player.x - z.x);
        z.x += Math.cos(angle)*z.speed;
        z.y += Math.sin(angle)*z.speed;

        ctx.fillStyle="green";
        ctx.beginPath();
        ctx.arc(z.x,z.y,z.size,0,Math.PI*2);
        ctx.fill();

        // Collision player
        const distPlayer = Math.hypot(player.x - z.x, player.y - z.y);
        if(distPlayer < player.size + z.size){
            alert("Game Over! Score: "+score);
            location.reload();
        }

        // Collision bullet
        bullets.forEach((b,bi)=>{
            const dist = Math.hypot(b.x - z.x, b.y - z.y);
            if(dist < b.size + z.size){
                zombies.splice(zi,1);
                bullets.splice(bi,1);
                score++;
                document.getElementById("score").innerText = score;
            }
        });
    });

    requestAnimationFrame(update);
}

setInterval(spawnZombie, 1500);
update();
</script>

</body>
</html>
